<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nalbbun Backend API Catalog</title>
    <link rel="stylesheet" href="/css/api-docs.css">
</head>
<body>
    <header class="page-header">
        <div>
            <p class="eyebrow">NALBBUN BACKEND API</p>
            <h1>API Catalog</h1>
            <p class="description">백엔드 프로젝트는 API와 최소한의 API 목록 화면만 제공합니다. 실제 업무 화면은 별도 frontend-web 프로젝트에서 구동합니다.</p>
        </div>
    </header>
    <main class="page-content">
        <section class="info-panel">
            <h2>운영 원칙</h2>
            <ul>
                <li>백엔드는 API, SSE, 관리자용 JSON 엔드포인트를 제공합니다.</li>
                <li>민감한 키, DB 정보, 장비 연결 정보는 프론트에 노출하지 않습니다.</li>
                <li>실제 화면은 별도 frontend-web 프로젝트에서 관리합니다.</li>
            </ul>
        </section>
        <section>
            <div class="section-header">
                <h2>Endpoint Groups</h2>
                <button id="reloadButton" type="button">새로고침</button>
            </div>
            <div id="catalogContainer" class="catalog-grid"></div>
        </section>
    </main>
    <script src="/js/api-docs.js"></script>
</body>
</html>
