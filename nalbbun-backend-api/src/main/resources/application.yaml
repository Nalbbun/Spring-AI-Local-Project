spring:
  mvc:
    async:
     request-timeout: -1

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  application:
    name: nalbbun-ai-local

  output:
    ansi:
      enabled: ALWAYS

  thymeleaf:
    cache: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 30MB
      max-request-size: 150MB
    encoding:
      enabled: true
      charset: UTF-8
      force: true
  
  session:
    store-type: ${SPRING_SESSION_STORE_TYPE:none}
    redis:
      namespace: ${SPRING_SESSION_REDIS_NAMESPACE:nalbbun:session}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    url: ${SPRING_FLYWAY_URL:${APP_API_DATASOURCE_URL:${SPRING_DATASOURCE_URL:}}}
    user: ${SPRING_FLYWAY_USER:${APP_API_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:}}}
    password: ${SPRING_FLYWAY_PASSWORD:${APP_API_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}
    baseline-on-migrate: true

  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
          no-store: true
          must-revalidate: true

  ai:
    chat:
      client:
        enabled: true

    openai:
      api-key: ${OPENAI_API_KEY:placeholder-openai-key-for-local-runtime}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4.1-mini}
          temperature: 0.7

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://192.168.1.10:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.1:8b}
          keep-alive: 1300s
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
          keep-alive: 1300s

    model:
      embedding: ${SPRING_AI_MODEL_EMBEDDING:ollama}

    vectorstore:
      type: ${SPRING_AI_VECTORSTORE_TYPE:pgvector}
      pgvector:
        initialize-schema: ${SPRING_AI_VECTORSTORE_PGVECTOR_INITIALIZE_SCHEMA:true}
        dimensions: ${SPRING_AI_VECTORSTORE_PGVECTOR_DIMENSIONS:768}

app:
  debug:
    enabled: ${APP_DEBUG_ENABLED:true}

  category:
    resolver:
      mode: HYBRID

  parser:
    general:
      mode: HYBRID
    travel:
      mode: HYBRID
    dev:
      mode: HYBRID
    mice:
      mode: HYBRID

  llm:
    fallback-policy: ${APP_LLM_FALLBACK_POLICY:BLOCK_OPENAI}
    timeout-ms: ${APP_LLM_TIMEOUT_MS:180000}
    retry-attempts: ${APP_LLM_RETRY_ATTEMPTS:1}
    retry-backoff-ms: ${APP_LLM_RETRY_BACKOFF_MS:800}

  memory:
    store: ${APP_MEMORY_STORE:jdbc}
    redis:
      ttl-hours: ${APP_MEMORY_REDIS_TTL_HOURS:24}
      session-ttl-minutes: ${APP_MEMORY_REDIS_SESSION_TTL_MINUTES:180}
    jdbc:
      datasource:
        url: ${APP_MEMORY_JDBC_DATASOURCE_URL:${APP_API_DATASOURCE_URL:${SPRING_DATASOURCE_URL:}}}
        username: ${APP_MEMORY_JDBC_DATASOURCE_USERNAME:${APP_API_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:}}}
        password: ${APP_MEMORY_JDBC_DATASOURCE_PASSWORD:${APP_API_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}
        driver-class-name: ${APP_MEMORY_JDBC_DATASOURCE_DRIVER_CLASS_NAME:${APP_API_DATASOURCE_DRIVER_CLASS_NAME:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}}}

  prompt:
    store: ${APP_PROMPT_STORE:jdbc}

  apikey:
    secret: ${APP_APIKEY_SECRET:nalbbun-api-key-secret-32bytes!!}

  api:
    datasource:
      url: ${APP_API_DATASOURCE_URL:${SPRING_DATASOURCE_URL:}}
      username: ${APP_API_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
      password: ${APP_API_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
      driver-class-name: ${APP_API_DATASOURCE_DRIVER_CLASS_NAME:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}}

  vector:
    datasource:
      url: ${APP_VECTOR_DATASOURCE_URL:${SPRING_DATASOURCE_URL:}}
      username: ${APP_VECTOR_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
      password: ${APP_VECTOR_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
      driver-class-name: ${APP_VECTOR_DATASOURCE_DRIVER_CLASS_NAME:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}}

  search:
    provider: ${APP_SEARCH_PROVIDER:tavily}
    tavily:
      api-key: ${TAVILY_API_KEY:}
      max-results: ${TAVILY_MAX_RESULTS:5}

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

  rag:
    enabled: ${APP_RAG_ENABLED:true}
    vector-store: ${APP_RAG_VECTOR_STORE:pgvector}
    top-k: ${APP_RAG_TOP_K:4}
    similarity-threshold: ${APP_RAG_SIMILARITY_THRESHOLD:0.72}
    include-citations: ${APP_RAG_INCLUDE_CITATIONS:true}
    categories:
      general: ${APP_RAG_GENERAL_ENABLED:false}
      dev: ${APP_RAG_DEV_ENABLED:true}
      mice: ${APP_RAG_MICE_ENABLED:true}
      travel: ${APP_RAG_TRAVEL_ENABLED:false}
    ingest:
      chunk-size: ${APP_RAG_CHUNK_SIZE:350}
      min-chunk-size-chars: ${APP_RAG_MIN_CHUNK_SIZE_CHARS:120}
      min-chunk-length-to-embed: ${APP_RAG_MIN_CHUNK_LENGTH_TO_EMBED:10}
      max-num-chunks: ${APP_RAG_MAX_NUM_CHUNKS:128}
      max-upload-file-count: ${APP_RAG_MAX_UPLOAD_FILE_COUNT:20}

  executor:
    chat:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 100
    travel:
      core-pool-size: 6
      max-pool-size: 12
      queue-capacity: 100
    llm:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 50

  api-llm:
    connect-timeout-ms: ${APP_API_LLM_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${APP_API_LLM_READ_TIMEOUT_MS:15000}

  vllm:
    base-url: ${APP_VLLM_BASE_URL:http://192.168.0.208:9000}
    default-model: ${APP_VLLM_DEFAULT_MODEL:}
    key-provider: ${APP_VLLM_KEY_PROVIDER:VLLM}

  openai-runtime:
    base-url: ${APP_OPENAI_RUNTIME_BASE_URL:https://api.openai.com/v1}
    key-provider: ${APP_OPENAI_RUNTIME_KEY_PROVIDER:OPENAI}

  ollama:
    base-url: ${OLLAMA_BASE_URL:http://192.168.1.10:11434}
    connect-timeout-ms: ${APP_OLLAMA_CONNECT_TIMEOUT_MS:5000}
    request-timeout-ms: ${APP_OLLAMA_REQUEST_TIMEOUT_MS:300000}
    model-source: RUNNING
    default-general-model: ${APP_OLLAMA_GENERAL_MODEL:llama3.1:8b}
    default-dev-model: ${APP_OLLAMA_DEV_MODEL:llama3.1:8bb}
    default-mice-model: ${APP_OLLAMA_MICE_MODEL:llama3.1:8b}
    default-travel-search-model: ${APP_OLLAMA_TRAVEL_SEARCH_MODEL:llama3.1:8b}
    default-travel-plan-model: ${APP_OLLAMA_TRAVEL_PLAN_MODEL:llama3.1:8b}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${APP_MEMORY_REDIS_SESSION_TTL_MINUTES:180}m

logging:
  pattern:
    console: "%clr(%-5level){green} %clr(%logger.%M\\(\\)){cyan}: %msg%n"
