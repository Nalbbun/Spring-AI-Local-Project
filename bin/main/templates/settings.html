<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>설정 — Nalbbun AI</title>
    <link rel="stylesheet" href="/css/console-common.css">
</head>
<body>

<div th:replace="~{fragments/nav :: nav}" th:with="currentPage='settings'"></div>

<div class="page-wrap">

    <!-- 헤더 -->
    <div class="card hero-title">
        <div>
            <h1>⚙️ 설정</h1>
            <div class="small">Ollama 연결, 카테고리별 모델, Resolver/Parser 모드를 조회하고 변경합니다. 변경 즉시 적용됩니다.</div>
        </div>
        <div class="status">
            <span class="chip" id="ollamaStatusChip">ollama: -</span>
            <span class="chip" id="fallbackChip">fallback: -</span>
            <span class="chip" id="memoryChip">memory: -</span>
        </div>
    </div>

    <!-- Ollama 연결 -->
    <div class="card">
        <h2>Ollama 연결</h2>
        <div class="row2">
            <div>
                <label for="ollamaBaseUrl">Base URL</label>
                <input id="ollamaBaseUrl" placeholder="http://127.0.0.1:11434">
            </div>
            <div>
                <label>연결 상태</label>
                <div id="ollamaConnStatus" class="panel" style="min-height:48px;padding:10px">아직 조회하지 않음</div>
            </div>
        </div>
        <div class="actions top-gap">
            <button id="btnCheckConn" class="primary" type="button">🔌 연결 확인</button>
            <button id="btnSaveConn" class="green" type="button">💾 URL 저장</button>
            <button id="btnResetConn" class="gray" type="button">↩ 초기화</button>
        </div>
    </div>

    <!-- 카테고리별 모델 -->
    <div class="card">
        <h2>카테고리별 모델</h2>
        <div class="small">Ollama 실행 중인 모델 목록을 조회한 뒤 카테고리별로 선택합니다.</div>
        <div class="actions top-gap">
            <button id="btnLoadModels" class="primary" type="button">🔄 모델 목록 조회</button>
        </div>
        <div class="grid top-gap">
            <div>
                <label for="generalModel">GENERAL 모델</label>
                <select id="generalModel"><option value="">-- 선택 --</option></select>
            </div>
            <div>
                <label for="devModel">DEV 모델</label>
                <select id="devModel"><option value="">-- 선택 --</option></select>
            </div>
            <div>
                <label for="miceModel">MICE 모델</label>
                <select id="miceModel"><option value="">-- 선택 --</option></select>
            </div>
            <div>
                <label for="travelSearchModel">TRAVEL Search 모델 <span class="small">(tool calling 필요)</span></label>
                <select id="travelSearchModel"><option value="">-- 선택 --</option></select>
            </div>
            <div>
                <label for="travelPlanModel">TRAVEL Plan 모델</label>
                <select id="travelPlanModel"><option value="">-- 선택 --</option></select>
            </div>
        </div>
        <div id="modelStatus" class="panel top-gap" style="min-height:40px">모델 설정 대기 중</div>
        <div class="actions top-gap">
            <button id="btnSaveModels" class="green" type="button">💾 모델 저장</button>
            <button id="btnResetModels" class="gray" type="button">↩ 모델 초기화</button>
        </div>
    </div>

    <!-- Resolver / Parser 모드 -->
    <div class="card">
        <h2>Resolver / Parser 모드</h2>
        <div class="small">RULE: 키워드 기반, LLM: AI 분류, HYBRID: RULE 우선 후 LLM 보완</div>
        <div class="grid top-gap">
            <div>
                <label for="resolverMode">Category Resolver 모드</label>
                <select id="resolverMode">
                    <option value="HYBRID">HYBRID (권장)</option>
                    <option value="RULE">RULE</option>
                    <option value="LLM">LLM</option>
                </select>
            </div>
            <div>
                <label for="generalParserMode">GENERAL Parser</label>
                <select id="generalParserMode">
                    <option value="HYBRID">HYBRID</option>
                    <option value="RULE">RULE</option>
                    <option value="LLM">LLM</option>
                </select>
            </div>
            <div>
                <label for="devParserMode">DEV Parser</label>
                <select id="devParserMode">
                    <option value="HYBRID">HYBRID</option>
                    <option value="RULE">RULE</option>
                    <option value="LLM">LLM</option>
                </select>
            </div>
            <div>
                <label for="miceParserMode">MICE Parser</label>
                <select id="miceParserMode">
                    <option value="HYBRID">HYBRID</option>
                    <option value="RULE">RULE</option>
                    <option value="LLM">LLM</option>
                </select>
            </div>
            <div>
                <label for="travelParserMode">TRAVEL Parser</label>
                <select id="travelParserMode">
                    <option value="HYBRID">HYBRID</option>
                    <option value="RULE">RULE</option>
                    <option value="LLM">LLM</option>
                </select>
            </div>
        </div>
        <div id="configStatus" class="panel top-gap" style="min-height:40px">설정 대기 중</div>
        <div class="actions top-gap">
            <button id="btnSaveConfig" class="green" type="button">💾 모드 저장</button>
            <button id="btnResetConfig" class="gray" type="button">↩ 설정 초기화</button>
        </div>
    </div>

    <!-- 즉시 테스트 -->
    <div class="card">
        <h2>현재 설정으로 즉시 테스트</h2>
        <div class="row2">
            <div>
                <label for="testCategory">카테고리</label>
                <select id="testCategory">
                    <option value="">자동 분류</option>
                    <option value="GENERAL">GENERAL</option>
                    <option value="DEV">DEV</option>
                    <option value="MICE">MICE</option>
                    <option value="TRAVEL">TRAVEL</option>
                </select>
            </div>
            <div>
                <label for="testMessage">질문</label>
                <textarea id="testMessage" spellcheck="false" placeholder="테스트 질문을 입력하세요..."></textarea>
            </div>
        </div>
        <div class="actions top-gap">
            <button id="btnTest" class="primary" type="button">▶ 테스트 실행</button>
            <button id="btnTestClear" class="gray" type="button">화면 지우기</button>
        </div>
        <div class="grid top-gap">
            <div>
                <label>응답</label>
                <div id="testResult" class="panel" style="min-height:200px"></div>
            </div>
            <div>
                <label>이벤트 로그 (모델 trace 포함)</label>
                <div id="testLog" class="panel" style="min-height:200px"></div>
            </div>
        </div>
    </div>

</div>

<script src="/js/rag-common.js"></script>
<script src="/js/chat-common.js"></script>
<script src="/js/settings-page.js"></script>
</body>
</html>
