<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RAG 관리 — Nalbbun AI</title>
    <link rel="stylesheet" href="/css/console-common.css">
</head>
<body>

<div th:replace="~{fragments/nav :: nav}" th:with="currentPage='rag'"></div>

<div class="page-wrap-wide">

    <!-- 헤더 -->
    <div class="card hero-title">
        <div>
            <h1>🗄 RAG 관리</h1>
            <div class="small">문서 소스 등록·조회·삭제, 검색 테스트를 수행합니다. RAG 채팅 테스트는 <a href="/chat/rag">📚 RAG채팅</a> 에서 하세요.</div>
        </div>
        <div class="status">
            <span class="chip" id="ragEnabledChip">rag: -</span>
            <span class="chip" id="ragVectorChip">vector: -</span>
            <span class="chip" id="ragDbChip">db: -</span>
        </div>
    </div>

    <!-- RAG 설정 현황 -->
    <div class="card">
        <h2>RAG 설정 현황</h2>
        <div class="grid3">
            <div>
                <label>Vector Store</label>
                <div id="ragVectorStore" class="panel" style="min-height:40px;padding:8px">-</div>
            </div>
            <div>
                <label>TopK / Similarity Threshold</label>
                <div id="ragSearchParams" class="panel" style="min-height:40px;padding:8px">-</div>
            </div>
            <div>
                <label>카테고리별 RAG 활성화</label>
                <div id="ragCategories" class="panel" style="min-height:40px;padding:8px">-</div>
            </div>
        </div>
        <div class="actions top-gap">
            <button id="btnRefreshStatus" class="primary" type="button">🔄 상태 새로고침</button>
        </div>
    </div>

    <!-- 소스 목록 -->
    <div class="card">
        <h2>등록된 소스 목록</h2>
        <div class="row2">
            <div>
                <label for="listCategory">카테고리</label>
                <select id="listCategory">
                    <option value="DEV">DEV</option>
                    <option value="MICE">MICE</option>
                    <option value="GENERAL">GENERAL</option>
                    <option value="TRAVEL">TRAVEL</option>
                </select>
            </div>
            <div style="display:flex;align-items:flex-end">
                <button id="btnListSources" class="primary" style="width:auto;min-width:140px" type="button">🔍 소스 목록 조회</button>
            </div>
        </div>
        <div class="table-wrap top-gap">
            <table class="table">
                <thead>
                    <tr>
                        <th>Source</th><th>Version</th><th>Title</th>
                        <th>파일수</th><th>Chunks</th><th>최종 인덱스</th>
                        <th>인제스트 유형</th><th style="min-width:160px">작업</th>
                    </tr>
                </thead>
                <tbody id="sourceTableBody"><tr><td colspan="8">소스를 조회하세요.</td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- 인제스트 -->
    <div class="grid">

        <!-- 파일 업로드 -->
        <div class="card">
            <h2>📁 파일 인제스트</h2>
            <div class="small">PDF, DOCX, Markdown, 텍스트 파일을 지원합니다.</div>
            <div class="top-gap">
                <label for="ingestCategory">카테고리</label>
                <select id="ingestCategory">
                    <option value="DEV">DEV</option>
                    <option value="MICE">MICE</option>
                    <option value="GENERAL">GENERAL</option>
                    <option value="TRAVEL">TRAVEL</option>
                </select>
            </div>
            <div class="row2 top-gap">
                <div><label for="ingestSource">Source</label><input id="ingestSource" placeholder="예: my-docs"></div>
                <div><label for="ingestVersion">Version</label><input id="ingestVersion" value="v1"></div>
            </div>
            <div class="top-gap"><label for="ingestTitle">Title</label><input id="ingestTitle" placeholder="예: My Documents"></div>
            <div class="row2 top-gap">
                <div><label for="ingestFile">단일 파일</label><input id="ingestFile" type="file"></div>
                <div><label for="ingestFiles">멀티 파일</label><input id="ingestFiles" type="file" multiple></div>
            </div>
            <div class="actions top-gap">
                <button id="btnIngestSingle" class="green" type="button">단일 업로드</button>
                <button id="btnIngestMulti" class="primary" type="button">멀티 업로드</button>
            </div>
            <div id="fileIngestStatus" class="panel top-gap" style="min-height:60px">대기 중</div>
        </div>

        <!-- URL / 텍스트 인제스트 -->
        <div class="card">
            <h2>🌐 URL / 텍스트 인제스트</h2>
            <div class="top-gap">
                <label for="urlIngestCategory">카테고리</label>
                <select id="urlIngestCategory">
                    <option value="DEV">DEV</option>
                    <option value="MICE">MICE</option>
                    <option value="GENERAL">GENERAL</option>
                    <option value="TRAVEL">TRAVEL</option>
                </select>
            </div>
            <div class="row2 top-gap">
                <div><label for="urlIngestSource">Source</label><input id="urlIngestSource" placeholder="예: web-docs"></div>
                <div><label for="urlIngestVersion">Version</label><input id="urlIngestVersion" value="v1"></div>
            </div>
            <div class="top-gap"><label for="urlIngestTitle">Title</label><input id="urlIngestTitle" placeholder="예: Web Document"></div>
            <div class="top-gap"><label for="ingestUrl">URL</label><input id="ingestUrl" placeholder="https://..."></div>
            <div class="top-gap"><label for="ingestText">또는 텍스트 직접 입력</label><textarea id="ingestText" spellcheck="false" placeholder="텍스트를 직접 입력해 RAG에 등록합니다."></textarea></div>
            <div class="actions top-gap">
                <button id="btnIngestUrl" class="yellow" type="button">🌐 URL 인제스트</button>
                <button id="btnIngestText" class="gray" type="button">📝 텍스트 인제스트</button>
            </div>
            <div id="urlIngestStatus" class="panel top-gap" style="min-height:60px">대기 중</div>
        </div>

    </div>

    <!-- RAG 검색 테스트 -->
    <div class="card">
        <h2>🔍 RAG 검색 테스트</h2>
        <div class="grid3">
            <div>
                <label for="searchCategory">카테고리</label>
                <select id="searchCategory">
                    <option value="DEV">DEV</option>
                    <option value="MICE">MICE</option>
                    <option value="GENERAL">GENERAL</option>
                    <option value="TRAVEL">TRAVEL</option>
                </select>
            </div>
            <div>
                <label for="searchSource">Source 필터 <span class="small">(선택)</span></label>
                <input id="searchSource" placeholder="비우면 전체">
            </div>
            <div>
                <label for="searchVersion">Version 필터 <span class="small">(선택)</span></label>
                <input id="searchVersion" placeholder="비우면 전체">
            </div>
        </div>
        <div class="top-gap">
            <label for="searchQuery">검색 쿼리</label>
            <textarea id="searchQuery" spellcheck="false" placeholder="RAG에서 검색할 내용을 입력하세요..." style="min-height:80px"></textarea>
        </div>
        <div class="actions top-gap">
            <button id="btnSearch" class="primary" type="button">🔍 검색 실행</button>
            <button id="btnSearchClear" class="gray" type="button">화면 지우기</button>
        </div>
        <div id="searchResultPanel" class="panel top-gap" style="min-height:120px">검색 결과가 여기에 표시됩니다.</div>
    </div>

    <!-- 이벤트 로그 -->
    <div class="card">
        <h2>이벤트 로그</h2>
        <div id="eventLog" class="panel" style="min-height:120px"></div>
    </div>

</div>

<script src="/js/rag-common.js"></script>
<script src="/js/chat-common.js"></script>
<script src="/js/rag-page.js"></script>
</body>
</html>
