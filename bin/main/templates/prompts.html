<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>프롬프트 관리 — Nalbbun AI</title>
    <link rel="stylesheet" href="/css/console-common.css">
</head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<div class="page-wrap-wide">

    <!-- 헤더 -->
    <div class="card hero-title">
        <div>
            <h1>📝 프롬프트 관리</h1>
            <div class="small">카테고리별 시스템 프롬프트를 등록하고, 채팅 시 선택해서 적용합니다.</div>
        </div>
        <div class="status">
            <span class="chip" id="storeChip">store: -</span>
            <span class="chip" id="totalChip">total: -</span>
            <span class="chip" id="activeChip">active: -</span>
        </div>
    </div>

    <!-- 저장소 안내 -->
    <div class="card">
        <h2>저장소 설정</h2>
        <div class="small">
            저장소 변경은 <a href="/settings">⚙️ 설정</a> 페이지 또는 환경변수
            <code>APP_PROMPT_STORE=jdbc|redis</code> 로 지정합니다.
            현재 저장소: <strong id="storeTypeLabel">-</strong>
        </div>
        <div class="actions top-gap">
            <button id="btnRefresh"  class="primary" type="button">🔄 목록 새로고침</button>
            <button id="btnSeedDefaults" class="gray" type="button">🌱 기본 프롬프트 시드</button>
        </div>
        <div id="seedStatus" class="small top-gap" style="color:#94a3b8"></div>
    </div>

    <!-- 카테고리 탭 + 목록/편집 영역 -->
    <div class="grid">

        <!-- 왼쪽: 목록 -->
        <div class="card" style="min-width:0">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                <h2 style="margin:0">프롬프트 목록</h2>
                <button id="btnNewPrompt" class="green" style="width:auto;min-width:110px" type="button">＋ 새 프롬프트</button>
            </div>

            <!-- 카테고리 필터 -->
            <div class="mem-tabs top-gap">
                <button class="mem-tab active" data-cat="" onclick="window._filterCat(this, '')">전체</button>
                <button class="mem-tab" data-cat="GENERAL" onclick="window._filterCat(this,'GENERAL')">💬 GENERAL</button>
                <button class="mem-tab" data-cat="DEV"     onclick="window._filterCat(this,'DEV')">💻 DEV</button>
                <button class="mem-tab" data-cat="MICE"    onclick="window._filterCat(this,'MICE')">🎪 MICE</button>
                <button class="mem-tab" data-cat="TRAVEL"  onclick="window._filterCat(this,'TRAVEL')">✈️ TRAVEL</button>
            </div>

            <div id="listStatus" class="small top-gap" style="color:#94a3b8"></div>
            <div class="table-wrap top-gap">
                <table class="table">
                    <thead>
                        <tr>
                            <th>이름</th>
                            <th>카테고리</th>
                            <th>기본</th>
                            <th>활성</th>
                            <th style="min-width:110px">작업</th>
                        </tr>
                    </thead>
                    <tbody id="promptTable">
                        <tr><td colspan="5">목록을 조회 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 오른쪽: 편집 폼 -->
        <div class="card" style="min-width:0">
            <h2 id="formTitle">✏️ 프롬프트 편집</h2>
            <div class="small top-gap">신규 생성 시 ID는 자동 발급됩니다.</div>

            <div class="grid top-gap">
                <div>
                    <label for="fName">프롬프트 이름 <span style="color:#f87171">*</span></label>
                    <input id="fName" placeholder="예: DEV 코드리뷰 전용">
                </div>
                <div>
                    <label for="fCategory">카테고리</label>
                    <select id="fCategory">
                        <option value="">공통 (카테고리 무관)</option>
                        <option value="GENERAL">GENERAL</option>
                        <option value="DEV">DEV</option>
                        <option value="MICE">MICE</option>
                        <option value="TRAVEL">TRAVEL</option>
                    </select>
                </div>
            </div>

            <div class="top-gap">
                <label for="fDesc">설명 <span class="small">(선택)</span></label>
                <input id="fDesc" placeholder="이 프롬프트의 용도나 특징을 간단히 입력하세요">
            </div>

            <div class="top-gap">
                <label for="fSystemPrompt">
                    시스템 프롬프트 <span style="color:#f87171">*</span>
                    <span class="small" style="margin-left:8px;color:#94a3b8">LLM에 전달되는 역할 지시문</span>
                </label>
                <textarea id="fSystemPrompt" spellcheck="false"
                    style="min-height:240px;font-family:monospace;font-size:13px;line-height:1.6"
                    placeholder="당신은 ... 어시스턴트입니다.&#10;..."></textarea>
            </div>

            <div class="grid top-gap">
                <div style="display:flex;align-items:center;gap:10px">
                    <input type="checkbox" id="fIsDefault" style="width:auto;margin:0">
                    <label for="fIsDefault" style="margin:0;cursor:pointer">이 카테고리의 기본 프롬프트로 설정</label>
                </div>
                <div style="display:flex;align-items:center;gap:10px">
                    <input type="checkbox" id="fActive" checked style="width:auto;margin:0">
                    <label for="fActive" style="margin:0;cursor:pointer">활성화</label>
                </div>
            </div>

            <div id="formStatus" class="panel top-gap" style="min-height:40px">프롬프트를 선택하거나 새로 작성하세요.</div>

            <div class="actions top-gap">
                <button id="btnSave"   class="green"   type="button">💾 저장</button>
                <button id="btnCancel" class="gray"    type="button">✕ 취소</button>
                <button id="btnDelete" class="red"     type="button" style="display:none">🗑 삭제</button>
            </div>
        </div>
    </div>

    <!-- 이벤트 로그 -->
    <div class="card">
        <h2>이벤트 로그</h2>
        <div id="eventLog" class="panel" style="min-height:60px"></div>
    </div>

</div>

<style>
/* 프롬프트 기본 뱃지 */
.badge-default { display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;
    font-weight:700;background:#14532d;color:#6ee7b7; }
.badge-inactive { display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;
    background:#1e293b;color:#64748b; }
.badge-active { display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;
    background:#1e3a5f;color:#93c5fd; }
.badge-cat { display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;
    font-weight:600;background:#1e293b;color:#94a3b8; }
</style>

<script src="/js/rag-common.js"></script>
<script src="/js/prompts-page.js"></script>
</body>
</html>
