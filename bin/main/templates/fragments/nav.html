<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="nav" class="site-nav">
    <div class="nav-inner">
        <a class="nav-brand" href="/">🤖 Nalbbun AI</a>
        <div class="nav-links" id="siteNavLinks">
			<span class="nav-divider">일반 테스트|</span>
            <a href="/"           data-path="/"           >💬 일반채팅</a>
            <a href="/chat/rag"   data-path="/chat/rag"   >📚 RAG채팅</a>
            <a href="/chat/agent" data-path="/chat/agent" >🤖 에이전트채팅</a>
            <span class="nav-divider">| |</span>
            <a href="/settings"   data-path="/settings"   >⚙️ 설정</a>
            <a href="/api-keys"   data-path="/api-keys"   >🔑 API 키</a>
            <a href="/prompts"    data-path="/prompts"    >📝 프롬프트</a>
            <a href="/rag"        data-path="/rag"        >🗄 RAG관리</a>
            <a href="/agent"      data-path="/agent"      >🚀 에이전트관리</a>
            <a href="/memory"     data-path="/memory"     >💾 대화관리</a>
        </div>
    </div>
    <script>
    (function() {
        var path = window.location.pathname;
        document.querySelectorAll('#siteNavLinks a[data-path]').forEach(function(a) {
            var dp = a.getAttribute('data-path');
            // 정확히 일치하거나 (루트 제외) 경로 접두사 일치
            if (dp === '/' ? path === '/' : path === dp || path.startsWith(dp + '/')) {
                a.classList.add('active');
            }
        });
    })();
    </script>
</nav>
</body>
</html>
