<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>API 키 관리 — Nalbbun AI</title>
    <link rel="stylesheet" href="/css/console-common.css">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="page-wrap-wide">

    <!-- 헤더 -->
    <div class="card hero-title">
        <div>
            <h1>🔑 API 키 관리</h1>
            <div class="small">외부 서비스 API 키를 안전하게 저장하고 런타임에 적용합니다. 키는 AES-256 암호화로 저장됩니다.</div>
        </div>
        <div class="status">
            <span class="chip" id="chipOpenai">OpenAI: -</span>
            <span class="chip" id="chipTavily">Tavily: -</span>
        </div>
    </div>

    <!-- 프로바이더 현황 -->
    <div class="card">
        <h2>프로바이더 현황</h2>
        <div class="small top-gap" style="color:#94a3b8">각 프로바이더의 활성 키 상태입니다.</div>
        <div id="providerGrid" class="grid top-gap">
            <div class="panel" style="min-height:60px;padding:12px">조회 중...</div>
        </div>
        <div class="actions top-gap">
            <button id="btnRefresh" class="primary" type="button">🔄 새로고침</button>
        </div>
    </div>

    <!-- 목록 + 편집 -->
    <div class="grid">

        <!-- 왼쪽: 목록 -->
        <div class="card" style="min-width:0">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                <h2 style="margin:0">등록된 API 키</h2>
                <button id="btnNew" class="green" style="width:auto;min-width:110px" type="button">＋ 새 키 등록</button>
            </div>

            <!-- 프로바이더 필터 -->
            <div class="mem-tabs top-gap">
                <button class="mem-tab active" data-prov="" onclick="window._filterProv(this,'')">전체</button>
                <button class="mem-tab" data-prov="OPENAI"    onclick="window._filterProv(this,'OPENAI')">OpenAI</button>
                <button class="mem-tab" data-prov="TAVILY"    onclick="window._filterProv(this,'TAVILY')">Tavily</button>
                <button class="mem-tab" data-prov="ANTHROPIC" onclick="window._filterProv(this,'ANTHROPIC')">Anthropic</button>
                <button class="mem-tab" data-prov="CUSTOM"    onclick="window._filterProv(this,'CUSTOM')">Custom</button>
            </div>

            <div id="listStatus" class="small top-gap" style="color:#94a3b8"></div>
            <div class="table-wrap top-gap">
                <table class="table">
                    <thead>
                        <tr>
                            <th>레이블</th><th>프로바이더</th><th>키 (마스킹)</th>
                            <th>상태</th><th style="min-width:130px">작업</th>
                        </tr>
                    </thead>
                    <tbody id="keyTable">
                        <tr><td colspan="5">목록을 조회 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 오른쪽: 편집 폼 -->
        <div class="card" style="min-width:0">
            <h2 id="formTitle">🔑 API 키 등록</h2>

            <div class="grid top-gap">
                <div>
                    <label for="fProvider">프로바이더 <span style="color:#f87171">*</span></label>
                    <select id="fProvider">
                        <option value="">-- 선택 --</option>
                        <option value="OPENAI">OpenAI (GPT 계열)</option>
                        <option value="TAVILY">Tavily (웹 검색)</option>
                        <option value="ANTHROPIC">Anthropic (Claude — 향후 지원)</option>
                        <option value="CUSTOM">Custom</option>
                    </select>
                </div>
                <div>
                    <label for="fLabel">레이블 <span style="color:#f87171">*</span></label>
                    <input id="fLabel" placeholder="예: 운영 OpenAI 키, 개발용 Tavily">
                </div>
            </div>

            <div class="top-gap">
                <label for="fDesc">설명 <span class="small">(선택)</span></label>
                <input id="fDesc" placeholder="키 용도, 만료일 등">
            </div>

            <!-- API 키 입력 — 비밀번호 형태 -->
            <div class="top-gap">
                <label for="fKeyValue">
                    API 키 값 <span style="color:#f87171">*</span>
                    <span class="small" style="color:#64748b"> — 수정 시 비우면 기존 키 유지</span>
                </label>
                <div style="display:flex;gap:6px;align-items:center">
                    <input id="fKeyValue" type="password" placeholder="sk-... 또는 tvly-..."
                           style="font-family:monospace;flex:1" autocomplete="new-password">
                    <button id="btnToggleKey" type="button"
                        style="width:auto;min-width:50px;padding:10px 12px;background:#334155;border-radius:8px;border:1px solid #475569;color:#94a3b8;cursor:pointer"
                        onclick="window._toggleKeyVisibility()">👁</button>
                </div>
                <div id="keyStrength" class="small top-gap" style="color:#64748b"></div>
            </div>

            <div style="display:flex;align-items:center;gap:10px;margin-top:14px">
                <input type="checkbox" id="fActive" checked style="width:auto;margin:0">
                <label for="fActive" style="margin:0;cursor:pointer">
                    활성화 <span class="small" style="color:#64748b">(활성화 시 런타임에 즉시 적용)</span>
                </label>
            </div>

            <!-- 키 발급 URL 안내 -->
            <div id="keyIssueHint" class="top-gap"
                style="display:none;padding:8px 12px;background:#0b1220;border:1px solid #1e293b;border-radius:8px;font-size:12px;color:#64748b">
            </div>

            <div id="formStatus" class="panel top-gap" style="min-height:44px">API 키를 선택하거나 새로 등록하세요.</div>

            <div class="actions top-gap">
                <button id="btnSave"   class="green"   type="button">💾 저장</button>
                <button id="btnCancel" class="gray"    type="button">✕ 취소</button>
                <button id="btnDelete" class="red"     type="button" style="display:none">🗑 삭제</button>
            </div>
        </div>
    </div>

    <!-- 이벤트 로그 -->
    <div class="card">
        <h2>이벤트 로그</h2>
        <div id="eventLog" class="panel" style="min-height:60px"></div>
    </div>
</div>

<style>
.key-reveal-box {
    background:#0b1220;border:1px solid #2563eb;border-radius:8px;
    padding:10px 14px;font-family:monospace;font-size:13px;
    color:#93c5fd;word-break:break-all;margin-top:6px;
}
</style>

<script src="/js/rag-common.js"></script>
<script src="/js/api-keys-page.js"></script>
</body>
</html>
