<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Agent Chat Debug Console</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }
        .container {
            max-width: 1250px;
            margin: 24px auto;
            padding: 0 16px;
        }
        .card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            padding: 20px;
            margin-bottom: 18px;
        }
        h1,h2,h3 { margin-top: 0; }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        @media (max-width: 960px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 700;
        }
        select, textarea, input, button {
            width: 100%;
            padding: 11px 12px;
            font-size: 14px;
            border-radius: 10px;
            border: 1px solid #d0d7de;
        }
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .buttons button {
            flex: 1;
            min-width: 140px;
            border: none;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
        }
        .primary { background: #1f6feb; }
        .secondary { background: #6c757d; }
        .danger { background: #d1242f; }
        .success { background: #198754; }

        .status-box {
            margin-top: 12px;
            padding: 12px;
            border-radius: 10px;
            background: #eef6ff;
            white-space: pre-wrap;
            font-size: 14px;
        }
        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .chip {
            padding: 7px 10px;
            border-radius: 999px;
            background: #edf2f7;
            border: 1px solid #d9e2ec;
            font-size: 12px;
        }
        .running { background: #fff3cd; border-color: #ffe69c; }
        .complete { background: #d1e7dd; border-color: #badbcc; }
        .warning { background: #ffe5d0; border-color: #ffcf99; }
        .error { background: #f8d7da; border-color: #f1aeb5; }

        .panel {
            min-height: 320px;
            padding: 14px;
            border-radius: 10px;
            background: #111827;
            color: #e5e7eb;
            white-space: pre-wrap;
            font-family: Consolas, monospace;
            overflow-y: auto;
        }
        .light-panel {
            min-height: 220px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            background: #fafafa;
            white-space: pre-wrap;
            overflow-x: auto;
        }
        .small {
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>
<div class="container">
	<div class="card">
	    <h2>Ollama Model Debug</h2>
	    <p>실행 중 모델(/api/ps) 또는 설치 모델(/api/tags)을 읽어서 선택합니다.</p>

	    <div class="grid-3">
	        <div>
	            <label for="ollamaModelSource">Model Source</label>
	            <select id="ollamaModelSource" onchange="loadOllamaModels()">
	                <option value="RUNNING">RUNNING (/api/ps)</option>
	                <option value="INSTALLED">INSTALLED (/api/tags)</option>
	            </select>
	        </div>
	        <div>
	            <label for="travelSearchModel">TRAVEL Search Model</label>
	            <select id="travelSearchModel"></select>
	        </div>
	        <div>
	            <label for="travelPlanModel">TRAVEL Plan Model</label>
	            <select id="travelPlanModel"></select>
	        </div>
	        <div>
	            <label for="generalModel">GENERAL Model</label>
	            <select id="generalModel"></select>
	        </div>
	        <div>
	            <label for="devModel">DEV Model</label>
	            <select id="devModel"></select>
	        </div>
	        <div>
	            <label for="miceModel">MICE Model</label>
	            <select id="miceModel"></select>
	        </div>
	    </div>

	    <div class="buttons">
	        <button class="success" onclick="loadOllamaModelConfig()">현재 모델 설정 조회</button>
	        <button class="primary" onclick="saveOllamaModelConfig()">모델 설정 저장</button>
	        <button class="secondary" onclick="resetOllamaModelConfig()">모델 설정 초기화</button>
	    </div>

	    <div id="ollamaModelStatus" class="status-box">Ollama 모델 설정 상태 대기 중</div>
	</div>
    <div class="card">
        <h1>Agent Chat Debug Console</h1>
        <p>resolver mode / parser mode를 런타임으로 바꿔가며 테스트하는 UI</p>

        <div class="grid-3">
            <div>
                <label for="resolverMode">Category Resolver Mode</label>
                <select id="resolverMode">
                    <option value="RULE">RULE</option>
                    <option value="LLM">LLM</option>
                    <option value="HYBRID">HYBRID</option>
                </select>
            </div>
            <div>
                <label for="generalParserMode">GENERAL Parser Mode</label>
                <select id="generalParserMode">
                    <option value="RULE">RULE</option>
                    <option value="LLM">LLM</option>
                    <option value="HYBRID">HYBRID</option>
                </select>
            </div>
            <div>
                <label for="travelParserMode">TRAVEL Parser Mode</label>
                <select id="travelParserMode">
                    <option value="RULE">RULE</option>
                    <option value="LLM">LLM</option>
                    <option value="HYBRID">HYBRID</option>
                </select>
            </div>
            <div>
                <label for="devParserMode">DEV Parser Mode</label>
                <select id="devParserMode">
                    <option value="RULE">RULE</option>
                    <option value="LLM">LLM</option>
                    <option value="HYBRID">HYBRID</option>
                </select>
            </div>
            <div>
                <label for="miceParserMode">MICE Parser Mode</label>
                <select id="miceParserMode">
                    <option value="RULE">RULE</option>
                    <option value="LLM">LLM</option>
                    <option value="HYBRID">HYBRID</option>
                </select>
            </div>
            <div>
                <label for="category">Request Category (optional)</label>
                <select id="category">
                    <option value="">자동 분류</option>
                    <option value="GENERAL">GENERAL</option>
                    <option value="TRAVEL">TRAVEL</option>
                    <option value="DEV">DEV</option>
                    <option value="MICE">MICE</option>
                </select>
            </div>
        </div>

        <div class="buttons">
            <button class="success" onclick="loadDebugConfig()">현재 설정 조회</button>
            <button class="primary" onclick="saveDebugConfig()">설정 저장</button>
            <button class="secondary" onclick="resetDebugConfig()">설정 초기화</button>
        </div>

        <div id="configStatus" class="status-box">디버그 설정 상태 대기 중</div>
        <div id="runtimeStoreStatus" class="status-box">메모리 저장소 정보 대기 중</div>
    </div>

    <div class="card">
        <h2>질문 테스트</h2>

        <div class="grid-2">
            <div>
                <label for="example">예시 질문</label>
                <select id="example" onchange="applyExample()">
                    <option value="">직접 입력</option>
                    <option value="안녕 오늘 뭐 도와줄 수 있어?">GENERAL 예시</option>
                    <option value="부산 2박3일 80만원 여행 일정 짜줘">TRAVEL 예시</option>
                    <option value="Spring Boot 프로젝트를 새 Gradle 구조로 리팩토링 순서 정리해줘">DEV 예시</option>
                    <option value="국제 포럼 운영 제안서의 배경 목표 방향 구조를 정리해줘">MICE 예시</option>
                    <option value="제주도 여행 일정도 짜주고 Spring Boot 리팩토링 순서도 설명해줘">혼합 의도 예시</option>
                </select>
            </div>
            <div>
                <label for="message">메시지</label>
                <textarea id="message" spellcheck="false">안녕 오늘 뭐 도와줄 수 있어?</textarea>
            </div>
        </div>

        <div class="buttons">
            <button class="primary" onclick="startStream()">스트리밍 전송</button>
            <button class="secondary" onclick="loadMemory()">메모리 조회</button>
            <button class="danger" onclick="clearMemory()">메모리 초기화</button>
        </div>

        <div class="small">권장: mode를 바꾼 뒤 같은 질문을 반복해서 결과 차이를 확인하세요.</div>
    </div>

    <div class="grid-2">
        <div class="card">
            <h3>Agent 이벤트</h3>
            <div id="agentChips" class="chips"></div>
            <div id="streamLog" class="panel"></div>
        </div>

        <div class="card">
            <h3>메모리 상태</h3>
            <div class="chips">
                <span id="memoryStoreBadge" class="chip">store: -</span>
                <span id="memoryServiceBadge" class="chip">service: -</span>
            </div>
            <div id="memoryPanel" class="light-panel">아직 조회하지 않음</div>
        </div>
    </div>
</div>

<script>
    let source = null;
    const agentStateMap = {};

    function setConfigStatus(text) {
        document.getElementById("configStatus").textContent = text;
    }

    function setRuntimeStoreStatus(text) {
        document.getElementById("runtimeStoreStatus").textContent = text;
    }

    function renderMemoryStoreInfo(data) {
        const store = data.memoryStore || 'unknown';
        const serviceType = data.memoryServiceType || 'unknown';
        document.getElementById('memoryStoreBadge').textContent = `store: ${store}`;
        document.getElementById('memoryServiceBadge').textContent = `service: ${serviceType}`;
        setRuntimeStoreStatus(
            `메모리 저장소
store=${store}
service=${serviceType}
* 저장소 변경은 프로필/환경변수 변경 후 재시작이 필요합니다.`
        );
    }

    function logLine(text) {
        const log = document.getElementById("streamLog");
        log.textContent += text + "\n";
        log.scrollTop = log.scrollHeight;
    }

    function resetStreamUi() {
        document.getElementById("streamLog").textContent = "";
        Object.keys(agentStateMap).forEach(key => delete agentStateMap[key]);
        renderAgentChips();
    }

    function renderAgentChips() {
        const container = document.getElementById("agentChips");
        container.innerHTML = "";

        Object.entries(agentStateMap).forEach(([agent, info]) => {
            const chip = document.createElement("span");
            chip.className = `chip ${info.status || ""}`;
            chip.textContent = `${agent} | ${info.status} | ${info.message}`;
            container.appendChild(chip);
        });
    }

    function applyExample() {
        const value = document.getElementById("example").value;
        if (value) {
            document.getElementById("message").value = value;
        }
    }

    async function fetchJson(url, options = {}) {
        const res = await fetch(url, options);
        const text = await res.text();

        if (!res.ok) {
            throw new Error(`HTTP ${res.status}: ${text}`);
        }

        try {
            return JSON.parse(text);
        } catch (e) {
            throw new Error(`JSON parse error: ${text}`);
        }
    }

    async function loadDebugConfig() {
        try {
            const data = await fetchJson('/debug/api/config');

            document.getElementById('resolverMode').value = data.resolverMode || 'HYBRID';
            document.getElementById('generalParserMode').value = data.generalParserMode || 'HYBRID';
            document.getElementById('travelParserMode').value = data.travelParserMode || 'HYBRID';
            document.getElementById('devParserMode').value = data.devParserMode || 'HYBRID';
            document.getElementById('miceParserMode').value = data.miceParserMode || 'HYBRID';

            setConfigStatus(
                `설정 조회 완료
resolver=${data.resolverMode}
general=${data.generalParserMode}
travel=${data.travelParserMode}
dev=${data.devParserMode}
mice=${data.miceParserMode}`
            );
            renderMemoryStoreInfo(data);
        } catch (e) {
            setConfigStatus('설정 조회 실패: ' + e.message);
        }
    }

    async function saveDebugConfig() {
        const payload = {
            resolverMode: document.getElementById('resolverMode').value,
            generalParserMode: document.getElementById('generalParserMode').value,
            travelParserMode: document.getElementById('travelParserMode').value,
            devParserMode: document.getElementById('devParserMode').value,
            miceParserMode: document.getElementById('miceParserMode').value
        };

        try {
            const data = await fetchJson('/debug/api/config', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            setConfigStatus(
                `설정 저장 완료
resolver=${data.resolverMode}
general=${data.generalParserMode}
travel=${data.travelParserMode}
dev=${data.devParserMode}
mice=${data.miceParserMode}`
            );
            renderMemoryStoreInfo(data);
        } catch (e) {
            setConfigStatus('설정 저장 실패: ' + e.message);
        }
    }

    async function resetDebugConfig() {
        try {
            const data = await fetchJson('/debug/api/config/reset', {
                method: 'POST'
            });

            document.getElementById('resolverMode').value = data.resolverMode || 'HYBRID';
            document.getElementById('generalParserMode').value = data.generalParserMode || 'HYBRID';
            document.getElementById('travelParserMode').value = data.travelParserMode || 'HYBRID';
            document.getElementById('devParserMode').value = data.devParserMode || 'HYBRID';
            document.getElementById('miceParserMode').value = data.miceParserMode || 'HYBRID';

            setConfigStatus('설정 초기화 완료');
            renderMemoryStoreInfo(data);
        } catch (e) {
            setConfigStatus('설정 초기화 실패: ' + e.message);
        }
    }

    function startStream() {
        if (source) {
            source.close();
            source = null;
        }

        resetStreamUi();

        const message = document.getElementById("message").value.trim();
        const category = document.getElementById("category").value.trim();

        if (!message) {
            logLine("[error] 메시지를 입력하세요.");
            return;
        }

        let url = `/api/chat/stream?message=${encodeURIComponent(message)}`;
        if (category) {
            url += `&category=${encodeURIComponent(category)}`;
        }

        logLine(`[request-message] ${message}`);
        logLine(`[request-category] ${category || 'AUTO'}`);

        source = new EventSource(url);

        source.addEventListener("agent", (event) => {
            try {
                const data = JSON.parse(event.data);
                agentStateMap[data.agent] = {
                    status: data.status,
                    message: data.message
                };
                renderAgentChips();
                logLine(`[agent] ${data.agent} | ${data.status} | ${data.message}`);
            } catch (e) {
                logLine(`[agent-parse-error] ${event.data}`);
            }
        });

        source.addEventListener("message", (event) => {
            logLine(`[message]\n${event.data}\n`);
        });

        source.addEventListener("complete", () => {
            logLine(`[complete] 스트림 종료`);
            if (source) {
                source.close();
                source = null;
            }
        });

        source.addEventListener("error", () => {
            logLine(`[error] 스트림 오류 또는 종료`);
            if (source) {
                source.close();
                source = null;
            }
        });
    }

    async function loadMemory() {
        try {
            const data = await fetchJson('/debug/api/memory');
            document.getElementById("memoryPanel").textContent = JSON.stringify(data, null, 2);
        } catch (e) {
            document.getElementById("memoryPanel").textContent = '메모리 조회 실패: ' + e.message;
        }
    }

    async function clearMemory() {
        try {
            const res = await fetch('/debug/api/memory/clear', { method: 'POST' });
            const text = await res.text();
            if (!res.ok) {
                throw new Error(`HTTP ${res.status}: ${text}`);
            }
            document.getElementById("memoryPanel").textContent = text;
            logLine(`[memory] ${text}`);
        } catch (e) {
            document.getElementById("memoryPanel").textContent = '메모리 초기화 실패: ' + e.message;
        }
    }

	window.addEventListener('load', async () => {
	    await loadDebugConfig();
	    await loadOllamaModelConfig();
	});
	
	function setOllamaModelStatus(text) {
	    document.getElementById("ollamaModelStatus").textContent = text;
	}

	function fillModelSelect(selectId, models, selectedValue) {
	    const select = document.getElementById(selectId);
	    select.innerHTML = "";

	    const emptyOption = document.createElement("option");
	    emptyOption.value = "";
	    emptyOption.textContent = "(선택 안 함)";
	    select.appendChild(emptyOption);

	    models.forEach(model => {
	        const option = document.createElement("option");
	        option.value = model.name;
	        option.textContent = model.name;
	        if (selectedValue && selectedValue === model.name) {
	            option.selected = true;
	        }
	        select.appendChild(option);
	    });
	}

	async function loadOllamaModels() {
	    const source = document.getElementById("ollamaModelSource").value;

	    try {
	        const data = await fetchJson(`/debug/api/ollama/models?source=${encodeURIComponent(source)}`);

	        fillModelSelect("travelSearchModel", data, document.getElementById("travelSearchModel").value);
	        fillModelSelect("travelPlanModel", data, document.getElementById("travelPlanModel").value);
	        fillModelSelect("generalModel", data, document.getElementById("generalModel").value);
	        fillModelSelect("devModel", data, document.getElementById("devModel").value);
	        fillModelSelect("miceModel", data, document.getElementById("miceModel").value);

	        setOllamaModelStatus(`모델 목록 로드 완료 (${source}) / 개수=${data.length}`);

	        const travelSearch = document.getElementById("travelSearchModel").value;
	        if (travelSearch && travelSearch.includes("azure99/blossom-v6.3")) {
	            setOllamaModelStatus(
	                `모델 목록 로드 완료 (${source}) / 개수=${data.length}
	경고: blossom-v6.3는 현재 travel search tool 호출에 사용할 수 없습니다.`
	            );
	        }
	    } catch (e) {
	        setOllamaModelStatus("모델 목록 조회 실패: " + e.message);
	    }
	}

	async function loadOllamaModelConfig() {
	    try {
	        const config = await fetchJson('/debug/api/ollama/config');

	        document.getElementById("ollamaModelSource").value = config.modelSource || "RUNNING";

	        await loadOllamaModels();

	        document.getElementById("travelSearchModel").value = config.travelSearchModel || "";
	        document.getElementById("travelPlanModel").value = config.travelPlanModel || "";
	        document.getElementById("generalModel").value = config.generalModel || "";
	        document.getElementById("devModel").value = config.devModel || "";
	        document.getElementById("miceModel").value = config.miceModel || "";

	        setOllamaModelStatus(
	            `모델 설정 조회 완료
				source=${config.modelSource}
				travelSearch=${config.travelSearchModel || "(none)"}
				travelPlan=${config.travelPlanModel || "(none)"}
				general=${config.generalModel || "(none)"}
				dev=${config.devModel || "(none)"}
				mice=${config.miceModel || "(none)"}`
	        );
	    } catch (e) {
	        setOllamaModelStatus("모델 설정 조회 실패: " + e.message);
	    }
	}

	async function saveOllamaModelConfig() {
	    const payload = {
	        modelSource: document.getElementById("ollamaModelSource").value,
	        travelSearchModel: document.getElementById("travelSearchModel").value,
	        travelPlanModel: document.getElementById("travelPlanModel").value,
	        generalModel: document.getElementById("generalModel").value,
	        devModel: document.getElementById("devModel").value,
	        miceModel: document.getElementById("miceModel").value
	    };

	    if (payload.travelSearchModel && payload.travelSearchModel.includes("azure99/blossom-v6.3")) {
	        setOllamaModelStatus("저장 중단: blossom-v6.3는 현재 travel search tool 호출용으로 사용할 수 없습니다.");
	        return;
	    }

	    try {
	        const config = await fetchJson('/debug/api/ollama/config', {
	            method: 'POST',
	            headers: {'Content-Type': 'application/json'},
	            body: JSON.stringify(payload)
	        });

	        setOllamaModelStatus(
	            `모델 설정 저장 완료
				source=${config.modelSource}
				travelSearch=${config.travelSearchModel || "(none)"}
				travelPlan=${config.travelPlanModel || "(none)"}
				general=${config.generalModel || "(none)"}
				dev=${config.devModel || "(none)"}
				mice=${config.miceModel || "(none)"}`
	        );
	    } catch (e) {
	        setOllamaModelStatus("모델 설정 저장 실패: " + e.message);
	    }
	}

	async function resetOllamaModelConfig() {
	    try {
	        const config = await fetchJson('/debug/api/ollama/config/reset', {
	            method: 'POST'
	        });

	        document.getElementById("ollamaModelSource").value = config.modelSource || "RUNNING";
	        await loadOllamaModels();

	        document.getElementById("travelSearchModel").value = config.travelSearchModel || "";
	        document.getElementById("travelPlanModel").value = config.travelPlanModel || "";
	        document.getElementById("generalModel").value = config.generalModel || "";
	        document.getElementById("devModel").value = config.devModel || "";
	        document.getElementById("miceModel").value = config.miceModel || "";

	        setOllamaModelStatus("모델 설정 초기화 완료");
	    } catch (e) {
	        setOllamaModelStatus("모델 설정 초기화 실패: " + e.message);
	    }
	}
</script>
</body>
</html>
