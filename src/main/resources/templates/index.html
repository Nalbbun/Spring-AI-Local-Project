<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>일반 채팅 — Nalbbun AI</title>
    <link rel="stylesheet" href="/css/console-common.css">
</head>
<body>

<div th:replace="~{fragments/nav :: nav}" th:with="currentPage='chat'"></div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-card">
        <div class="spinner"></div>
        <div id="loadingText">처리 중입니다...</div>
    </div>
</div>

<div class="page-wrap">

    <div class="card hero-title">
        <div>
            <h1>💬 일반 모델 채팅</h1>
            <div class="small">카테고리 자동 분류 후 Ollama / OpenAI 모델로 응답합니다. 모델·설정 변경은 <a href="/settings">⚙️ 설정</a> 페이지에서 하세요.</div>
        </div>
        <div class="status">
            <span class="chip" id="statusModel">model: -</span>
            <span class="chip" id="statusMemory">memory: -</span>
        </div>
    </div>

    <div class="card">
        <h2>질문</h2>
        <div class="row2">
            <div>
                <label for="category">카테고리</label>
                <select id="category">
                    <option value="">자동 분류</option>
                    <option value="GENERAL">GENERAL</option>
                    <option value="DEV">DEV</option>
                    <option value="MICE">MICE</option>
                    <option value="TRAVEL">TRAVEL</option>
                </select>
            </div>
            <div>
                <label for="message">질문 내용</label>
                <textarea id="message" spellcheck="false" placeholder="질문을 입력하세요...">안녕, 오늘 뭐 도와줄 수 있어?</textarea>
            </div>
        </div>
        <div class="actions top-gap">
            <button id="btnSend" class="primary" type="button">▶ 질문 보내기</button>
            <button id="btnClear" class="gray" type="button">화면 지우기</button>
            <button id="btnMemoryClear" class="red" type="button">🗑 대화 초기화</button>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>응답</h2>
            <div id="result" class="panel" style="min-height:300px"></div>
        </div>
        <div class="card">
            <h2>이벤트 로그</h2>
            <div id="eventLog" class="panel" style="min-height:300px"></div>
        </div>
    </div>

</div>

<script src="/js/rag-common.js"></script>
<script src="/js/chat-common.js"></script>
<script src="/js/chat-page.js"></script>
</body>
</html>
