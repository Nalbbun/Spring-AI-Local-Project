<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Nalbbun AI Local - Test</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; color: #222; }
        .container { max-width: 1080px; margin: 32px auto; padding: 0 16px; }
        .card { background: white; border-radius: 14px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); padding: 20px; margin-bottom: 18px; }
        h1, h2, h3 { margin-top: 0; }
        label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; }
        select, textarea, button, input { width: 100%; padding: 11px 12px; font-size: 14px; border-radius: 10px; border: 1px solid #d0d7de; }
        textarea { min-height: 130px; resize: vertical; }
        .grid { display: grid; grid-template-columns: 220px 1fr; gap: 16px; }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        @media (max-width: 860px) { .grid, .grid-2, .grid-3 { grid-template-columns: 1fr; } }
        .buttons { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        .buttons button { flex: 1; border: none; cursor: pointer; color: #fff; font-weight: 700; min-width: 180px; }
        .primary { background: #1f6feb; }
        .secondary { background: #6c757d; }
        .success { background: #198754; }
        .panel { min-height: 320px; padding: 14px; border-radius: 10px; background: #111827; color: #e5e7eb; white-space: pre-wrap; font-family: Consolas, monospace; overflow-y: auto; }
        .result { min-height: 180px; padding: 14px; border-radius: 10px; border: 1px solid #e5e7eb; background: #fafafa; white-space: pre-wrap; }
        .status-box { margin-top: 12px; padding: 12px; border-radius: 10px; background: #eef6ff; white-space: pre-wrap; border: 1px solid #cfe2ff; }
        .status-box.success { background: #d1e7dd; border-color: #badbcc; color: #0f5132; }
        .status-box.error { background: #f8d7da; border-color: #f1aeb5; color: #842029; }
        .status-box.running { background: #fff3cd; border-color: #ffe69c; color: #664d03; }
        .small { font-size: 12px; color: #555; }
        .table-wrap { overflow-x: auto; margin-top: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { border-bottom: 1px solid #e5e7eb; padding: 10px; text-align: left; }
        th { background: #f8fafc; }
        .link-box { font-size: 13px; color: #555; }
        .loading-overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(15, 23, 42, 0.35); z-index: 9999; }
        .loading-overlay.active { display: flex; }
        .loading-card { min-width: 280px; padding: 24px; border-radius: 16px; background: #111827; color: #f8fafc; box-shadow: 0 12px 30px rgba(0,0,0,0.2); text-align: center; }
        .spinner { width: 38px; height: 38px; border: 4px solid rgba(255,255,255,0.25); border-top-color: #60a5fa; border-radius: 50%; margin: 0 auto 14px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        a { color: #1f6feb; text-decoration: none; }
    </style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-card">
        <div class="spinner"></div>
        <div id="loadingText">처리 중입니다...</div>
    </div>
</div>
<div class="container">
    <div class="card">
        <h1>Nalbbun AI Local</h1>
        <div class="link-box">간단 테스트 페이지입니다. 상세 디버그는 <a href="/debug">/debug</a> 에서 확인하세요.</div>
    </div>

    <div class="card">
        <div class="grid">
            <div>
                <label for="category">카테고리</label>
                <select id="category">
                    <option value="">자동 분류</option>
                    <option value="GENERAL">GENERAL</option>
                    <option value="DEV">DEV</option>
                    <option value="MICE">MICE</option>
                    <option value="TRAVEL">TRAVEL</option>
                </select>
            </div>
            <div>
                <label for="message">질문</label>
                <textarea id="message" spellcheck="false">안녕, 오늘 뭐 도와줄 수 있어?</textarea>
            </div>
        </div>

        <div class="buttons">
            <button class="primary" onclick="startStream()">질문 보내기</button>
            <button class="secondary" onclick="clearView()">화면 지우기</button>
        </div>
    </div>

    <div class="card">
        <h2>RAG 업로드 테스트</h2>
        <div class="small">로컬 + debug enabled 상태에서 동작합니다. source를 비워두면 파일명 또는 title 기준으로 자동 생성됩니다.</div>
        <div class="grid-3">
            <div>
                <label for="ragCategory">RAG Category</label>
                <select id="ragCategory">
                    <option value="DEV">DEV</option>
                    <option value="MICE">MICE</option>
                    <option value="GENERAL">GENERAL</option>
                    <option value="TRAVEL">TRAVEL</option>
                </select>
            </div>
            <div>
                <label for="ragSource">Source (optional)</label>
                <input id="ragSource" placeholder="예: project-readme">
            </div>
            <div>
                <label for="ragVersion">Version</label>
                <input id="ragVersion" value="v1">
            </div>
        </div>
        <div class="grid-2" style="margin-top:12px;">
            <div>
                <label for="ragTitle">Title (optional)</label>
                <input id="ragTitle" placeholder="예: Project README">
            </div>
            <div>
                <label for="ragFile">단일 파일 업로드</label>
                <input id="ragFile" type="file" accept=".pdf,.md,.markdown,.txt,.log,.yaml,.yml,.json,.xml,.csv">
            </div>
        </div>
        <div class="grid-2" style="margin-top:12px;">
            <div>
                <label for="ragFiles">멀티파일 업로드</label>
                <input id="ragFiles" type="file" multiple accept=".pdf,.md,.markdown,.txt,.log,.yaml,.yml,.json,.xml,.csv">
            </div>
            <div>
                <label for="ragText">Text 적재</label>
                <textarea id="ragText" spellcheck="false" placeholder="텍스트를 직접 넣어 RAG에 적재할 수 있습니다."></textarea>
            </div>
        </div>
        <div class="buttons">
            <button class="success" onclick="uploadSingleFile()">단일 파일 업로드</button>
            <button class="primary" onclick="uploadMultiFiles()">멀티파일 업로드</button>
            <button class="secondary" onclick="ingestText()">텍스트 적재</button>
        </div>
        <div id="uploadStatus" class="status-box">업로드 상태 대기 중</div>
        <div class="table-wrap"><table><thead><tr><th>File</th><th>Source</th><th>Version</th><th>Title</th><th>Chunks</th><th>Status</th><th>Message</th></tr></thead><tbody id="uploadResultTable"><tr><td colspan="7">아직 결과가 없습니다.</td></tr></tbody></table></div>
    </div>

    <div class="card">
        <h2>응답</h2>
        <div id="result" class="result"></div>
    </div>

    <div class="card">
        <h2>이벤트 로그</h2>
        <div id="log" class="panel"></div>
    </div>
</div>

<script>
    let source = null;

    function byId(id) { return document.getElementById(id); }
    function val(id) { return (byId(id)?.value || '').trim(); }
    function logLine(text) {
        const log = byId('log');
        log.textContent += text + '\n';
        log.scrollTop = log.scrollHeight;
    }
    function setLoading(active, text = '처리 중입니다...') {
        byId('loadingText').textContent = text;
        byId('loadingOverlay').classList.toggle('active', active);
    }
    function setUploadStatus(text, type = 'running') {
        const box = byId('uploadStatus');
        box.className = 'status-box ' + type;
        box.textContent = text;
    }
    function renderUploadRows(items) {
        const body = byId('uploadResultTable');
        if (!items || items.length === 0) {
            body.innerHTML = '<tr><td colspan="7">아직 결과가 없습니다.</td></tr>';
            return;
        }
        body.innerHTML = items.map(item => `
            <tr>
                <td>${item.fileName || '-'}</td>
                <td>${item.source || '-'}</td>
                <td>${item.version || '-'}</td>
                <td>${item.title || '-'}</td>
                <td>${item.chunkCount ?? 0}</td>
                <td>${item.stored ? 'SUCCESS' : 'FAIL'}</td>
                <td>${item.message || '-'}</td>
            </tr>`).join('');
    }
    async function fetchJson(url, options = {}) {
        const res = await fetch(url, options);
        const text = await res.text();
        let json = null;
        try { json = text ? JSON.parse(text) : null; } catch (_) {}
        if (!res.ok) {
            const message = json?.message || text || `HTTP ${res.status}`;
            const hint = json?.hint ? `\n힌트: ${json.hint}` : '';
            throw new Error(message + hint);
        }
        return json;
    }
    function currentRagPayload() {
        return { category: val('ragCategory'), source: val('ragSource'), version: val('ragVersion') || 'v1', title: val('ragTitle') };
    }
    function applyResultIdentity(result) {
        if (!result) return;
        if (result.source) byId('ragSource').value = result.source;
        if (result.version) byId('ragVersion').value = result.version;
        if (result.title) byId('ragTitle').value = result.title;
    }
    function clearView() {
        byId('result').textContent = '';
        byId('log').textContent = '';
        if (source) { source.close(); source = null; }
    }
    function startStream() {
        if (source) { source.close(); source = null; }
        byId('result').textContent = '';
        byId('log').textContent = '';
        const message = val('message');
        const category = val('category');
        if (!message) { logLine('[error] 메시지를 입력하세요.'); return; }
        let url = `/api/chat/stream?message=${encodeURIComponent(message)}`;
        if (category) url += `&category=${encodeURIComponent(category)}`;
        logLine(`[request] ${message}`);
        logLine(`[category] ${category || 'AUTO'}`);
        source = new EventSource(url);
        source.addEventListener('agent', (event) => logLine(`[agent] ${event.data}`));
        source.addEventListener('message', (event) => { byId('result').textContent = event.data; logLine('[message] 응답 수신 완료'); });
        source.addEventListener('complete', () => { logLine('[complete] 스트림 종료'); if (source) { source.close(); source = null; } });
        source.addEventListener('error', () => { logLine('[error] 스트림 오류 또는 종료'); if (source) { source.close(); source = null; } });
    }
    async function uploadSingleFile() {
        const file = byId('ragFile').files[0];
        if (!file) { setUploadStatus('업로드 실패\n파일을 먼저 선택하세요.', 'error'); return; }
        const meta = currentRagPayload();
        const form = new FormData();
        form.append('category', meta.category);
        form.append('source', meta.source);
        form.append('version', meta.version);
        form.append('title', meta.title);
        form.append('file', file);
        try {
            setLoading(true, '단일 파일 업로드 중...');
            setUploadStatus('단일 파일 업로드를 처리 중입니다...', 'running');
            const data = await fetchJson('/debug/api/rag/ingest-file', { method: 'POST', body: form });
            applyResultIdentity(data.result);
            renderUploadRows([{ fileName: file.name, source: data.result.source, version: data.result.version, title: data.result.title, chunkCount: data.result.chunkCount, stored: data.result.stored, message: 'stored' }]);
            setUploadStatus(`업로드 완료\nsource=${data.result.source}\nversion=${data.result.version}\nchunks=${data.result.chunkCount}`, 'success');
            alert(`업로드 완료: ${file.name}`);
        } catch (e) {
            renderUploadRows([{ fileName: file.name, source: '-', version: '-', title: '-', chunkCount: 0, stored: false, message: e.message }]);
            setUploadStatus('업로드 실패\n' + e.message, 'error');
        } finally {
            setLoading(false);
        }
    }
    async function uploadMultiFiles() {
        const files = Array.from(byId('ragFiles').files || []);
        if (files.length === 0) { setUploadStatus('멀티파일 업로드 실패\n파일을 먼저 선택하세요.', 'error'); return; }
        const meta = currentRagPayload();
        const form = new FormData();
        form.append('category', meta.category);
        form.append('source', meta.source);
        form.append('version', meta.version);
        form.append('title', meta.title);
        files.forEach(file => form.append('files', file));
        try {
            setLoading(true, `멀티파일 업로드 중... (${files.length}개)`);
            setUploadStatus(`멀티파일 업로드를 처리 중입니다...\n선택 파일 수=${files.length}`, 'running');
            const data = await fetchJson('/debug/api/rag/ingest-files', { method: 'POST', body: form });
            applyResultIdentity(data.result);
            renderUploadRows(data.result.files || []);
            setUploadStatus(`멀티파일 업로드 완료\nsource=${data.result.source}\nversion=${data.result.version}\n성공=${data.result.successCount}, 실패=${data.result.failCount}, chunks=${data.result.totalChunkCount}`, data.result.failCount > 0 ? 'running' : 'success');
            alert(`멀티파일 업로드 완료: 성공 ${data.result.successCount}건 / 실패 ${data.result.failCount}건`);
        } catch (e) {
            setUploadStatus('멀티파일 업로드 실패\n' + e.message, 'error');
        } finally {
            setLoading(false);
        }
    }
    async function ingestText() {
        const text = val('ragText');
        if (!text) { setUploadStatus('텍스트 적재 실패\n텍스트를 입력하세요.', 'error'); return; }
        const meta = currentRagPayload();
        try {
            setLoading(true, '텍스트 적재 중...');
            setUploadStatus('텍스트 적재를 처리 중입니다...', 'running');
            const data = await fetchJson('/debug/api/rag/ingest-text', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...meta, text }) });
            applyResultIdentity(data.result);
            renderUploadRows([{ fileName: '(text)', source: data.result.source, version: data.result.version, title: data.result.title, chunkCount: data.result.chunkCount, stored: data.result.stored, message: 'stored' }]);
            setUploadStatus(`텍스트 적재 완료\nsource=${data.result.source}\nversion=${data.result.version}\nchunks=${data.result.chunkCount}`, 'success');
        } catch (e) {
            setUploadStatus('텍스트 적재 실패\n' + e.message, 'error');
        } finally {
            setLoading(false);
        }
    }
</script>
</body>
</html>
