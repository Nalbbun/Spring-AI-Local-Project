<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>에이전트 채팅 — Nalbbun AI</title>
    <link rel="stylesheet" href="/css/console-common.css">
</head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<div class="page-wrap">

    <div class="card hero-title">
        <div>
            <h1>🤖 에이전트 채팅</h1>
            <div class="small">다단계 에이전트 워크플로우 (TRAVEL 등)를 실행합니다. 에이전트 설정은 <a href="/agent">🚀 에이전트관리</a> 에서 하세요.</div>
        </div>
        <div class="status">
            <span class="chip" id="agentModelChip">search: -</span>
            <span class="chip" id="planModelChip">plan: -</span>
        </div>
    </div>

    <!-- 질문 입력 -->
    <div class="card">
        <h2>질문</h2>
        <div class="row2">
            <div>
                <label for="category">에이전트 카테고리</label>
                <select id="category">
                    <option value="TRAVEL">TRAVEL (여행 계획)</option>
                </select>
                <div class="small top-gap">현재 에이전트 지원 카테고리입니다. 향후 확장 예정.</div>
            </div>
            <div>
                <label for="message">질문 내용</label>
                <textarea id="message" spellcheck="false" placeholder="예: 부산 2박3일 80만원 여행 일정 짜줘"></textarea>
            </div>
        </div>
        <div class="actions top-gap">
            <button id="btnSend" class="primary" type="button">▶ 에이전트 실행</button>
            <button id="btnClear" class="gray" type="button">화면 지우기</button>
            <button id="btnMemoryClear" class="red" type="button">🗑 대화 초기화</button>
        </div>
    </div>

    <!-- 에이전트 단계 진행 표시 -->
    <div class="card">
        <h2>에이전트 진행 단계</h2>
        <div id="agentSteps" class="agent-steps">
            <div class="step-idle">에이전트를 실행하면 단계별 진행 상황이 표시됩니다.</div>
        </div>
        <div class="small top-gap">소요 시간: <span id="elapsedTime">-</span></div>
    </div>

    <!-- 응답 + 로그 -->
    <div class="grid">
        <div class="card">
            <h2>최종 응답</h2>
            <div id="result" class="panel" style="min-height:300px"></div>
        </div>
        <div class="card">
            <h2>이벤트 로그</h2>
            <div id="eventLog" class="panel" style="min-height:300px"></div>
        </div>
    </div>

    <!-- 현재 대화 메모리 패널 -->
    <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
            <h2 style="margin:0">💾 현재 대화 메모리</h2>
            <div class="actions" style="flex-wrap:nowrap">
                <button id="btnShowMemory"  class="primary" style="width:auto;min-width:100px" type="button">🔍 조회</button>
                <button id="btnClearMemory" class="red"     style="width:auto;min-width:100px" type="button">🗑 초기화</button>
                <a href="/memory" style="display:inline-block;padding:10px 14px;background:#334155;border-radius:10px;color:#93c5fd;font-size:13px;text-decoration:none">📋 전체 관리</a>
            </div>
        </div>
        <div id="memoryPanel" class="top-gap">
            <div class="mem-inline-empty">조회 버튼을 눌러 현재 대화 메모리를 확인하세요.</div>
        </div>
    </div>

</div>

<style>
.agent-steps { display: flex; flex-direction: column; gap: 8px; }
.step-idle { color: var(--muted); font-size: 13px; }
.agent-step { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-soft); background: #0b1220; font-size: 13px; }
.agent-step.running  { border-color: #2563eb; background: #0f1e3a; }
.agent-step.complete { border-color: #047857; background: #0a2018; }
.agent-step.error    { border-color: #b91c1c; background: #2a0a0a; }
.step-icon  { font-size: 16px; min-width: 22px; }
.step-body  { flex: 1; }
.step-name  { font-weight: 700; color: #e2e8f0; }
.step-msg   { color: #94a3b8; margin-top: 2px; }
</style>

<script src="/js/rag-common.js"></script>
<script src="/js/chat-common.js"></script>
<script src="/js/chat-memory-panel.js"></script>
<script src="/js/chat-agent-page.js"></script>
</body>
</html>
