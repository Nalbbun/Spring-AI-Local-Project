<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RAG 채팅 — Nalbbun AI</title>
    <link rel="stylesheet" href="/css/console-common.css">
</head>
<body>

<div th:replace="~{fragments/nav :: nav}" th:with="currentPage='chat-rag'"></div>

<div class="page-wrap">

    <div class="card hero-title">
        <div>
            <h1>📚 RAG 채팅</h1>
            <div class="small">벡터 DB에서 관련 문서를 검색한 뒤 컨텍스트로 주입합니다. RAG 소스 등록은 <a href="/rag">🗄 RAG관리</a> 에서 하세요.</div>
        </div>
        <div class="status">
            <span class="chip" id="ragStatusChip">rag: -</span>
            <span class="chip" id="dbStatusChip">db: -</span>
        </div>
    </div>

    <!-- 질문 입력 -->
    <div class="card">
        <h2>질문</h2>
        <div class="grid3">
            <div>
                <label for="category">카테고리</label>
                <select id="category">
                    <option value="DEV">DEV ✅ RAG</option>
                    <option value="MICE">MICE ✅ RAG</option>
                    <option value="GENERAL">GENERAL</option>
                    <option value="TRAVEL">TRAVEL</option>
                </select>
            </div>
            <div>
                <label for="sourceFilter">Source 필터 <span class="small">(선택)</span></label>
                <input id="sourceFilter" placeholder="예: project-docs">
            </div>
            <div>
                <label for="versionFilter">Version 필터 <span class="small">(선택)</span></label>
                <input id="versionFilter" placeholder="예: v1">
            </div>
        </div>
        <div class="top-gap">
            <label for="message">질문 내용</label>
            <textarea id="message" spellcheck="false" placeholder="RAG 문서를 참조해서 답해줘..."></textarea>
        </div>
        <div class="actions top-gap">
            <button id="btnSend" class="primary" type="button">▶ 질문 보내기</button>
            <button id="btnPreview" class="yellow" type="button">🔍 RAG 미리보기</button>
            <button id="btnClear" class="gray" type="button">화면 지우기</button>
            <button id="btnMemoryClear" class="red" type="button">🗑 대화 초기화</button>
        </div>
    </div>

    <!-- RAG 히트 문서 미리보기 -->
    <div class="card" id="ragPreviewCard" style="display:none">
        <h2>🔍 RAG 검색 결과 미리보기</h2>
        <div class="small">실제 채팅 시 프롬프트에 주입될 문서 청크입니다.</div>
        <div id="ragPreviewPanel" class="panel top-gap" style="min-height:120px"></div>
    </div>

    <!-- 응답 + 로그 -->
    <div class="grid">
        <div class="card">
            <h2>응답</h2>
            <div class="small" id="ragHitInfo"></div>
            <div id="result" class="panel top-gap" style="min-height:300px"></div>
        </div>
        <div class="card">
            <h2>이벤트 로그</h2>
            <div id="eventLog" class="panel" style="min-height:300px"></div>
        </div>
    </div>

</div>

<script src="/js/rag-common.js"></script>
<script src="/js/chat-common.js"></script>
<script src="/js/chat-rag-page.js"></script>
</body>
</html>
