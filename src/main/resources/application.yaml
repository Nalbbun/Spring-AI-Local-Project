spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  application:
    name: nalbbun-ai-local

  output:
    ansi:
      enabled: ALWAYS

  thymeleaf:
    cache: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB
    encoding:
      enabled: true
      charset: UTF-8
      force: true

  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
          no-store: true
          must-revalidate: true

  ai:
    chat:
      client:
        enabled: false

    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4.1-mini}
          temperature: 0.7

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://192.168.1.10:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:gemma2:9b}
          keep-alive: 300s

app:
  debug:
    enabled: ${APP_DEBUG_ENABLED:false}

  category:
    resolver:
      mode: HYBRID

  parser:
    general:
      mode: HYBRID
    travel:
      mode: HYBRID
    dev:
      mode: HYBRID
    mice:
      mode: HYBRID

  llm:
    fallback-policy: ${APP_LLM_FALLBACK_POLICY:BLOCK_OPENAI}
    timeout-ms: ${APP_LLM_TIMEOUT_MS:45000}
    retry-attempts: ${APP_LLM_RETRY_ATTEMPTS:2}
    retry-backoff-ms: ${APP_LLM_RETRY_BACKOFF_MS:800}

  memory:
    store: ${APP_MEMORY_STORE:in-memory}
    redis:
      ttl-hours: ${APP_MEMORY_REDIS_TTL_HOURS:24}

  search:
    provider: ${APP_SEARCH_PROVIDER:dummy}
    tavily:
      api-key: ${TAVILY_API_KEY:}
      max-results: ${TAVILY_MAX_RESULTS:5}

  executor:
    chat:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 100
    travel:
      core-pool-size: 6
      max-pool-size: 12
      queue-capacity: 100
    llm:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 50

  ollama:
    base-url: ${OLLAMA_BASE_URL:http://192.168.1.10:11434}
    model-source: RUNNING
    default-general-model: ${APP_OLLAMA_GENERAL_MODEL:gemma2:9b}
    default-dev-model: ${APP_OLLAMA_DEV_MODEL:qwen2.5-coder:14b}
    default-mice-model: ${APP_OLLAMA_MICE_MODEL:exaone3.5:7.8b}
    default-travel-search-model: ${APP_OLLAMA_TRAVEL_SEARCH_MODEL:gemma2:9b}
    default-travel-plan-model: ${APP_OLLAMA_TRAVEL_PLAN_MODEL:deepseek-r1:14b}

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    console: "%clr(%-5level){green} %clr(%logger.%M\\(\\)){cyan}: %msg%n"